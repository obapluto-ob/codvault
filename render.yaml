services:
  - type: web
    name: codvault-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: codvault-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 18.20.4
      - key: NODE_ENV
        value: production
      - key: ADMIN_TOKEN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CHALLONGE_API_KEY
        sync: false
      - key: CHALLONGE_USERNAME
        sync: false
